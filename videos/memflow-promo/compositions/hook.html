<template>
  <style>
    @font-face { font-family: "Lora"; src: url("assets/fonts/lora-semibold.ttf"); font-weight: 600; }
    #root { position: absolute; inset: 0; background: #FAF6EF; overflow: hidden; }
    #hook-logo { position: absolute; left: 410px; top: 390px; width: 300px; height: 300px; }
    #hook-line {
      position: absolute; left: 770px; top: 410px; width: 1000px;
      font-family: "Lora", serif; font-weight: 600; font-size: 92px; line-height: 1.12; letter-spacing: -0.03em; color: #D8CDBF;
    }
    #hook-line .w { display: inline-block; }
    #hook-line .accent { --ink: #D97B3F; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <img id="hook-logo" src="assets/brand/logo.png" alt="Memflow" />
    <div id="hook-line">
      <span class="w" data-at="0.50">Un</span> <span class="w" data-at="0.70">cours,</span> <span class="w" data-at="1.14">ça</span> <span class="w" data-at="1.32">se</span> <span class="w" data-at="1.46">retient</span><br />
      <span class="w" data-at="1.88">en</span> <span class="w" data-at="2.04">y</span> <span class="w accent" data-at="2.11">revenant.</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Logo lands (already present at frame 0 for the thumbnail).
    tl.fromTo("#hook-logo", { scale: 0.86, rotation: -6, opacity: 0.6 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0);
    // Each word is recalled — grey to ink — when the voice says it (voice starts at 0.5 s).
    document.querySelectorAll("#hook-line .w").forEach((w) => {
      const t = parseFloat(w.dataset.at);
      tl.fromTo(w, { color: "#D8CDBF" }, { color: w.classList.contains("accent") ? "#D97B3F" : "#2B241D", duration: 0.16, ease: "power2.out" }, t - 0.03);
    });
    // Exit: words blur away, the logo flies to the browser sidebar logo (screen 341,148 · 72 px).
    tl.to("#hook-line .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.025, ease: "power2.in" }, 2.38);
    tl.fromTo("#hook-logo", { x: 0, y: 0, scale: 1 }, { x: 341 - 560, y: 148 - 540, scale: 72 / 300, duration: 0.40, ease: "power3.inOut", immediateRender: false }, 2.36);
    window.__timelines["hook"] = tl;
  </script>
</template>
